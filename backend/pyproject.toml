[project]
name = "dramabuddy-local-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.136", "starlette>=0.49,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "celery[redis]>=5.4,<6", "itsdangerous>=2.2,<3", "boto3>=1.35,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
