name: ai-series
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: series
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/bootstrap-env.py first}
      POSTGRES_DB: series
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U series -d series"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: series-local
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run tools/bootstrap-env.py first}
    ports: ["127.0.0.1:29000:9000", "127.0.0.1:29001:9001"]
    volumes: ["storage_data:/data"]
  api:
    build: ./backend
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://series:${POSTGRES_PASSWORD}@postgres:5432/series
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_EXECUTOR: celery
      MEDIA_ROOT: /data/media
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: series-local
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: series-media
      TEXT_PROVIDER_BASE_URL: ${TEXT_PROVIDER_BASE_URL:-}
      TEXT_PROVIDER_API_KEY: ${TEXT_PROVIDER_API_KEY:-}
      TEXT_PROVIDER_MODEL: ${TEXT_PROVIDER_MODEL:-}
      IMAGE_PROVIDER_BASE_URL: ${IMAGE_PROVIDER_BASE_URL:-}
      IMAGE_PROVIDER_API_KEY: ${IMAGE_PROVIDER_API_KEY:-}
      IMAGE_PROVIDER_MODEL: ${IMAGE_PROVIDER_MODEL:-}
      AUDIO_PROVIDER_BASE_URL: ${AUDIO_PROVIDER_BASE_URL:-}
      AUDIO_PROVIDER_API_KEY: ${AUDIO_PROVIDER_API_KEY:-}
      AUDIO_PROVIDER_MODEL: ${AUDIO_PROVIDER_MODEL:-}
      VIDEO_PROVIDER_BASE_URL: ${VIDEO_PROVIDER_BASE_URL:-}
      VIDEO_PROVIDER_API_KEY: ${VIDEO_PROVIDER_API_KEY:-}
      VIDEO_PROVIDER_MODEL: ${VIDEO_PROVIDER_MODEL:-}
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["media_data:/data/media"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_started}
  worker:
    build: ./backend
    command: /app/.venv/bin/celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *api_environment
    volumes: ["media_data:/data/media"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_started}
  web:
    build: ./web
    ports: ["127.0.0.1:5175:80"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  storage_data:
  media_data:
